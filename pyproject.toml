[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebc-suite"
version = "0.1.0"
description = "Four Laws of Stable LLM Training"
readme = "README.md"
authors = [{name = "Hari Tedjamantri", email = "haryganteng06@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["torch>=1.13.0", "transformers>=4.30.0"]

[project.urls]
Repository = "https://github.com/ebc-clip/ebc-suite"

[project.optional-dependencies]
dev = ["pytest"]
